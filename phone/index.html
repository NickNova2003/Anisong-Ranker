<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f17">
<title>Nick's AniSong</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-play" viewBox="0 0 24 24"><path fill="currentColor" d="M8 5.6v12.8a1 1 0 0 0 1.5.86l10.2-6.4a1 1 0 0 0 0-1.72L9.5 4.74A1 1 0 0 0 8 5.6z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><rect fill="currentColor" x="6" y="5" width="4" height="14" rx="1.2"/><rect fill="currentColor" x="14" y="5" width="4" height="14" rx="1.2"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path fill="currentColor" d="M5 6.2v11.6a.8.8 0 0 0 1.24.67L15 12.67a.8.8 0 0 0 0-1.34L6.24 5.53A.8.8 0 0 0 5 6.2z"/><rect fill="currentColor" x="16.5" y="5.5" width="2.5" height="13" rx="1"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><path fill="currentColor" d="M19 6.2v11.6a.8.8 0 0 1-1.24.67L9 12.67a.8.8 0 0 1 0-1.34l8.76-5.8A.8.8 0 0 1 19 6.2z"/><rect fill="currentColor" x="5" y="5.5" width="2.5" height="13" rx="1"/></symbol>
  <symbol id="i-shuffle" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h4v4M4 20 20 4M20 16v4h-4M15 15l5 5M4 4l5 5"/></g></symbol>
  <symbol id="i-repeat" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></g></symbol>
  <symbol id="i-repeat1" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/><path d="M11 10h1v4"/></g></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle fill="currentColor" cx="12" cy="5" r="1.8"/><circle fill="currentColor" cx="12" cy="12" r="1.8"/><circle fill="currentColor" cx="12" cy="19" r="1.8"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="m15 18-6-6 6-6"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="m6 9 6 6 6-6"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m9 18 6-6-6-6"/></symbol>
  <symbol id="i-dl" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 7v9M8 12.5l4 4 4-4"/></g></symbol>
  <symbol id="i-done" viewBox="0 0 24 24"><circle fill="currentColor" cx="12" cy="12" r="10"/><path fill="none" stroke="#0b0f17" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M8 12.5l2.8 2.8L16.5 9"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/></g><rect fill="currentColor" x="9" y="9" width="6" height="6" rx="1"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></g></symbol>
  <symbol id="i-queue" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h12M3 12h12M3 18h8M17 13v8M17 13l4-1.5"/></g></symbol>
  <symbol id="i-playnext" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h11M3 12h7M3 18h7"/></g><path fill="currentColor" d="M14 11.2v7.6a.6.6 0 0 0 .9.5l6-3.8a.6.6 0 0 0 0-1l-6-3.8a.6.6 0 0 0-.9.5z"/></symbol>
  <symbol id="i-addq" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h12M3 12h12M3 18h7M18 15v6M15 18h6"/></g></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2.8l2.8 5.7 6.3.9-4.55 4.43 1.07 6.27L12 17.13 6.38 20.1l1.07-6.27L2.9 9.4l6.3-.9z"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M20.5 14.5A8.5 8.5 0 1 1 9.5 3.5a6.6 6.6 0 0 0 11 11z"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5"/><circle cx="10.5" cy="16" r="1.8"/><path d="M12.3 16V10l3 1"/></g></symbol>
  <symbol id="i-yt" viewBox="0 0 24 24"><rect fill="currentColor" x="2" y="5" width="20" height="14" rx="4.5"/><path fill="#0b0f17" d="M10 8.8v6.4l5.4-3.2z"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path fill="currentColor" d="M3 6.5A1.5 1.5 0 0 1 4.5 5h4.6l2 2h8.4A1.5 1.5 0 0 1 21 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/></symbol>
  <symbol id="i-music" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></g></symbol>
  <symbol id="i-library" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v16M9 4v16M14 4.5l5.5 15"/></g></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 20V12M12 20V5M17 20v-5M3 20h18"/></g></symbol>
  <symbol id="i-lists" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></g></symbol>
  <symbol id="i-sync" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 1-15.5 6.2M3 12A9 9 0 0 1 18.5 5.8M18 2v4h-4M6 22v-4h4"/></g></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></g></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></g></symbol>
  <symbol id="i-import" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></g></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="m6 15 6-6 6 6"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M6 6l12 12M18 6 6 18"/></symbol>
</svg>

<header id="top">
  <button class="icon" id="back" aria-label="Back" hidden><svg><use href="#i-back"/></svg></button>
  <h1 id="title">Library</h1>
  <span class="grow"></span>
  <span id="topExtra"></span>
</header>

<main id="view"></main>

<div id="mini" hidden>
  <img id="miniCover" alt="">
  <div class="meta" id="miniOpen"><div class="t" id="miniTitle"></div><div class="s" id="miniSub"></div></div>
  <button class="icon" id="miniPlay" aria-label="Play or pause"><svg><use href="#i-play"/></svg></button>
  <button class="icon" id="miniNext" aria-label="Next"><svg><use href="#i-next"/></svg></button>
  <div id="miniBar"><i></i></div>
</div>

<nav id="tabs">
  <button data-tab="library" class="on"><svg><use href="#i-library"/></svg>Library</button>
  <button data-tab="ranked"><svg><use href="#i-chart"/></svg>Ranked</button>
  <button data-tab="lists"><svg><use href="#i-lists"/></svg>Playlists</button>
  <button data-tab="sync"><svg><use href="#i-sync"/></svg>Sync<b id="badge" hidden></b></button>
</nav>

<section id="player" class="layer" hidden>
  <div class="phead"><button class="icon" data-back aria-label="Close"><svg><use href="#i-down"/></svg></button>
    <div class="grow pfrom" id="pFrom"></div>
    <button class="icon" id="pMore" aria-label="More"><svg><use href="#i-more"/></svg></button></div>
  <div id="pMain">
    <div id="pArt"><img id="pCover" alt=""><div id="pYT"><div id="ytFrame"></div></div></div>
    <div class="prow">
      <div class="meta"><div class="ptitle" id="pTitle"></div><div class="psub" id="pSub"></div></div>
      <button class="pscore" id="pScore" aria-label="Rate this song"></button>
    </div>
    <input type="range" id="pSeek" min="0" max="1000" value="0" aria-label="Seek">
    <div class="ptimes"><span id="pNow">0:00</span><span id="pDur">0:00</span></div>
    <div class="pctl">
      <button class="icon sm" id="pShuffle" aria-label="Shuffle"><svg><use href="#i-shuffle"/></svg></button>
      <button class="icon md" id="pPrev" aria-label="Previous"><svg><use href="#i-prev"/></svg></button>
      <button class="icon big" id="pPlay" aria-label="Play or pause"><svg><use href="#i-play"/></svg></button>
      <button class="icon md" id="pNext" aria-label="Next"><svg><use href="#i-next"/></svg></button>
      <button class="icon sm" id="pRepeat" aria-label="Repeat"><svg><use href="#i-repeat"/></svg></button>
    </div>
  </div>
  <div id="pQueue" hidden></div>
  <div class="pfoot">
    <button class="icon sm" id="pSleep" aria-label="Sleep timer"><svg><use href="#i-moon"/></svg><span id="pSleepTxt"></span></button>
    <span class="grow"></span>
    <button class="icon sm" id="pQueueBtn" aria-label="Queue"><svg><use href="#i-queue"/></svg></button>
  </div>
</section>

<section id="rate" class="layer" hidden>
  <div class="phead"><button class="icon" data-back aria-label="Close"><svg><use href="#i-down"/></svg></button>
    <div class="grow pfrom" id="rCount"></div></div>
  <div id="rBody"></div>
</section>

<div id="shade" hidden></div>
<div id="menu" hidden></div>
<div id="toast"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<input type="file" id="audioFile" accept="audio/*" hidden>
<script src="app.js"></script>
</body>
</html>
