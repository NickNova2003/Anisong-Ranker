<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e16">
<title>Nick's AniSong</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="top">
  <button class="icon" id="back" aria-label="Back" hidden>&#8249;</button>
  <h1 id="title">Library</h1>
  <span class="grow"></span>
  <span id="topExtra"></span>
</header>

<main id="view"></main>

<div id="mini" hidden>
  <img id="miniCover" alt="">
  <div class="meta" id="miniOpen"><div class="t" id="miniTitle"></div><div class="s" id="miniSub"></div></div>
  <button class="icon" id="miniPlay" aria-label="Play or pause"></button>
  <button class="icon" id="miniNext" aria-label="Next">&#9197;</button>
  <div id="miniBar"><i></i></div>
</div>

<nav id="tabs">
  <button data-tab="library" class="on"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>Library</button>
  <button data-tab="ranked"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Ranked</button>
  <button data-tab="lists"><svg viewBox="0 0 24 24"><path d="M3 6h13M3 12h13M3 18h9M19 14v7M16 18h6"/></svg>Playlists</button>
  <button data-tab="sync"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 1-15.5 6.2M3 12a9 9 0 0 1 15.5-6.2M18 2v4h-4M6 22v-4h4"/></svg>Sync<b id="badge" hidden></b></button>
</nav>

<section id="player" class="layer" hidden>
  <div class="phead"><button class="icon" data-back aria-label="Close">&#8964;</button><span class="grow"></span>
    <button class="chip" id="pSleep">Sleep</button><button class="chip" id="pQueueBtn">Queue</button></div>
  <div id="pMain">
    <img id="pCover" alt="">
    <div class="ptitle" id="pTitle"></div>
    <div class="psub" id="pSub"></div>
    <div class="pscore" id="pScore"></div>
    <input type="range" id="pSeek" min="0" max="1000" value="0" aria-label="Seek">
    <div class="ptimes"><span id="pNow">0:00</span><span id="pDur">0:00</span></div>
    <div class="pctl">
      <button class="icon sm" id="pShuffle" aria-label="Shuffle">&#128256;</button>
      <button class="icon" id="pPrev" aria-label="Previous">&#9198;</button>
      <button class="icon big" id="pPlay" aria-label="Play or pause"></button>
      <button class="icon" id="pNext" aria-label="Next">&#9197;</button>
      <button class="icon sm" id="pRepeat" aria-label="Repeat">&#128257;</button>
    </div>
  </div>
  <div id="pQueue" hidden></div>
</section>

<section id="rate" class="layer" hidden>
  <div class="phead"><button class="icon" data-back aria-label="Close">&#8964;</button>
    <span class="grow sub" id="rCount"></span></div>
  <div id="rBody"></div>
</section>

<div id="shade" hidden></div>
<div id="menu" hidden></div>
<div id="toast"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<input type="file" id="audioFile" accept="audio/*" hidden>
<script src="app.js"></script>
</body>
</html>
